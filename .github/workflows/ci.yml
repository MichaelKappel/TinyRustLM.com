name: TinyRustLM NuGet CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_deep_acquisition:
        description: Run deep protocol-v2 browser, companion, and Rust acquisition gates.
        required: false
        type: boolean
        default: false

jobs:
  verify-archive-scan-helper:
    name: Verify archive scanner (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Replay frozen hostile archive corpus
        run: cargo run --locked --manifest-path rust/crates/tinyrustlm-archive/fuzz/Cargo.toml --bin replay_archive_corpus

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify archive package producer and local consumer
        run: node --test tinyrustlm/tests/archive-fuzz-contract.test.js tinyrustlm/tests/archive-scan-helper-package.test.js tinyrustlm/tests/archive-scan-client.test.js tinyrustlm/tests/public-evidence-secret-scan.test.js

      - name: Build release archive scanner package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: eng/build-archive-scan-helper.ps1 -Configuration release

      - name: Build release archive scanner package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash eng/build-archive-scan-helper.sh release

      - name: Verify clean release-package consumer
        env:
          TINYRUSTLM_ARCHIVE_SCAN_TEST_PACKAGE_ROOT: ${{ github.workspace }}/artifacts/archive-scan-helper/${{ matrix.rid }}
        run: node --test tinyrustlm/tests/archive-scan-client.test.js tinyrustlm/tests/public-evidence-secret-scan.test.js

      - name: Upload verified archive scanner package
        uses: actions/upload-artifact@v4
        with:
          name: tinyrustlm-archive-scan-helper-${{ matrix.rid }}
          path: artifacts/archive-scan-helper/${{ matrix.rid }}/*
          if-no-files-found: error

  verify-archive-fuzz:
    name: Verify structured archive fuzz target
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pinned Rust nightly
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-08-01
          components: rust-src

      - name: Install pinned cargo-fuzz
        shell: bash
        run: |
          cargo +nightly-2026-08-01 install cargo-fuzz --version 0.13.2 --locked
          test "$(cargo +nightly-2026-08-01 fuzz --version)" = "cargo-fuzz 0.13.2"

      - name: Replay exact frozen manifest
        run: cargo +nightly-2026-08-01 run --locked --manifest-path rust/crates/tinyrustlm-archive/fuzz/Cargo.toml --bin replay_archive_corpus

      - name: Prepare isolated fuzz corpus
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/archive-fuzz-corpus"
          mkdir -p "${RUNNER_TEMP}/archive-fuzz-artifacts"
          cp rust/crates/tinyrustlm-archive/fuzz/corpus/structured_archive/*.seed "${RUNNER_TEMP}/archive-fuzz-corpus/"

      - name: Replay corpus through libFuzzer
        shell: bash
        run: |
          cargo +nightly-2026-08-01 fuzz run \
            --fuzz-dir "${GITHUB_WORKSPACE}/rust/crates/tinyrustlm-archive/fuzz" \
            --target-dir "${RUNNER_TEMP}/archive-fuzz-target" \
            structured_archive "${RUNNER_TEMP}/archive-fuzz-corpus" -- \
            -runs=0 \
            -max_len=4096 \
            -timeout=5 \
            -dict="${GITHUB_WORKSPACE}/rust/crates/tinyrustlm-archive/fuzz/dictionaries/structured_archive.dict" \
            -artifact_prefix="${RUNNER_TEMP}/archive-fuzz-artifacts/"

      - name: Run bounded sanitizer fuzzing
        shell: bash
        run: |
          cargo +nightly-2026-08-01 fuzz run \
            --fuzz-dir "${GITHUB_WORKSPACE}/rust/crates/tinyrustlm-archive/fuzz" \
            --target-dir "${RUNNER_TEMP}/archive-fuzz-target" \
            structured_archive "${RUNNER_TEMP}/archive-fuzz-corpus" -- \
            -max_total_time=60 \
            -max_len=4096 \
            -timeout=5 \
            -print_final_stats=1 \
            -dict="${GITHUB_WORKSPACE}/rust/crates/tinyrustlm-archive/fuzz/dictionaries/structured_archive.dict" \
            -artifact_prefix="${RUNNER_TEMP}/archive-fuzz-artifacts/"

      - name: Upload failure artifacts and working corpus
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tinyrustlm-archive-fuzz-failure-inputs
          path: |
            ${{ runner.temp }}/archive-fuzz-artifacts/*
            ${{ runner.temp }}/archive-fuzz-corpus/*
          if-no-files-found: warn

  verify-nuget-sdk:
    name: Verify protected NuGet SDK
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tinyrustlm/package-lock.json

      - name: Install browser test dependencies
        shell: pwsh
        run: npm ci --prefix tinyrustlm

      - name: Verify distillation and trained-adapter contracts
        shell: pwsh
        run: |
          python -m unittest discover -s tinyrustlm/tools/tests -p "test_*.py" -v
          cargo test -p tinyrustlm-slm-pack distillation
          cargo test -p tinyrustlm-slm-pack trained_adapter_source::tests

      - name: Verify offline and distributed MemoryEndpoints sync contracts
        shell: pwsh
        run: npm --prefix tinyrustlm run test:unit

      - name: Verify deployed distributed-sync wire contract against fixture
        shell: pwsh
        run: eng/verify-memory-endpoints-distributed-sync-fixture.ps1

      - name: Verify single-use enrollment replay and cleanup control flow
        shell: pwsh
        run: eng/verify-memory-endpoints-single-use-enrollment-fixture.ps1

      - name: Verify TinyRustLM UI contract
        shell: pwsh
        run: eng/verify-tinyrustlm-ui.ps1 -RunBrowserSmoke

      - name: Verify TinyRustLM public root contract
        shell: pwsh
        run: eng/verify-tinyrustlm-public-root.ps1

      - name: Verify TinyRustLM UI report schema
        shell: pwsh
        env:
          TINYRUSTLM_UI_VERIFICATION_REPORT: artifacts/reports/tinyrustlm-ui-verification.json
          TINYRUSTLM_PUBLIC_ROOT_VERIFICATION_REPORT: artifacts/reports/tinyrustlm-public-root-verification.json
        run: dotnet test dotnet/tests/TinyRustLM.Package.Tests/TinyRustLM.Package.Tests.csproj -c Release --filter "UiVerificationReportIsMachineReadableWhenPresent|PublicRootVerificationReportIsMachineReadableWhenPresent"

      - name: Verify package boundary
        shell: pwsh
        run: eng/verify-package.ps1 -IncludeOptionalMemoryEndpoints

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: tinyrustlm-nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error

      - name: Upload NuGet audit reports
        uses: actions/upload-artifact@v4
        with:
          name: tinyrustlm-nuget-reports
          path: artifacts/reports/*.json

      - name: Upload TinyRustLM UI verification reports
        uses: actions/upload-artifact@v4
        with:
          name: tinyrustlm-ui-verification
          path: |
            artifacts/reports/tinyrustlm-ui-verification.json
            artifacts/reports/tinyrustlm-public-root-verification.json
            artifacts/reports/ui-verification/**
            artifacts/reports/public-root-verification/**
          if-no-files-found: error

  verify-web-companion:
    name: Verify web-to-companion acceptance
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout TinyRustLM
        uses: actions/checkout@v4
        with:
          path: TinyRustLM.com

      - name: Checkout MiniModel
        uses: actions/checkout@v4
        with:
          repository: MichaelKappel/MiniModel.org
          path: MiniModel.org

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: TinyRustLM.com/tinyrustlm/package-lock.json

      - name: Build Rust MiniModel authority
        shell: pwsh
        run: cargo build --release --manifest-path MiniModel.org/Cargo.toml -p minimodel -p minimodel-native

      - name: Build downloadable companion tool
        shell: pwsh
        run: dotnet build TinyRustLM.com/dotnet/tools/TinyRustLM.SeedHost.Tool/TinyRustLM.SeedHost.Tool.csproj -c Debug

      - name: Reconstruct and verify large Qwen artifact when needed
        shell: pwsh
        run: |
          $artifact = 'TinyRustLM.com/artifacts/performance/qwen2.5-1.5b-instruct-q4.slm'
          $share = 'TinyRustLM.com/artifacts/seed-host-evidence/qwen-production-fleet/shares/tinyrustlm-qwen2-5-1-5b-instruct-q4-dc24eb832e8b'
          $manifest = Join-Path $share 'qwen2.5-1.5b-instruct-q4.minimodel.manifest.v0'
          $pieces = Join-Path $share 'qwen2.5-1.5b-instruct-q4.peer-pieces'
          if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) {
            & 'MiniModel.org/target/release/minimodel.exe' assemble-peer-pieces $manifest $pieces $artifact
            if ($LASTEXITCODE -ne 0) { throw 'Large Qwen artifact assembly failed' }
          }
          & 'MiniModel.org/target/release/minimodel.exe' verify-artifact $manifest $artifact
          if ($LASTEXITCODE -ne 0) { throw 'Large Qwen artifact verification failed' }
          $size = (Get-Item -LiteralPath $artifact).Length
          if ($size -ne 969648576) { throw "Large Qwen artifact size was $size" }

      - name: Install Playwright
        shell: pwsh
        run: |
          npm ci --prefix TinyRustLM.com/tinyrustlm
          npx --prefix TinyRustLM.com/tinyrustlm playwright install chromium

      - name: Verify TinyRustLM deep model-acquisition contract
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_deep_acquisition }}
        shell: pwsh
        working-directory: TinyRustLM.com
        run: eng/verify-tinyrustlm-ui.ps1 -RunDeepAcquisition -ReportOutput artifacts/reports/tinyrustlm-ui-deep-verification.json

      - name: Verify TinyRustLM deep UI report schema
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_deep_acquisition }}
        shell: pwsh
        working-directory: TinyRustLM.com
        env:
          TINYRUSTLM_UI_VERIFICATION_REPORT: artifacts/reports/tinyrustlm-ui-deep-verification.json
        run: dotnet test dotnet/tests/TinyRustLM.Package.Tests/TinyRustLM.Package.Tests.csproj -c Release --filter UiVerificationReportIsMachineReadableWhenPresent

      - name: Run complete browser and companion acceptance suite
        shell: pwsh
        working-directory: TinyRustLM.com
        run: npm --prefix tinyrustlm run test:e2e

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tinyrustlm-web-companion-playwright
          path: |
            TinyRustLM.com/tinyrustlm/artifacts/playwright/results.json
            TinyRustLM.com/tinyrustlm/artifacts/playwright/report
            TinyRustLM.com/tinyrustlm/artifacts/playwright/test-results
          if-no-files-found: warn

      - name: Upload deep model-acquisition evidence
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_deep_acquisition }}
        uses: actions/upload-artifact@v4
        with:
          name: tinyrustlm-deep-model-acquisition
          path: TinyRustLM.com/artifacts/reports/tinyrustlm-ui-deep-verification.json
          if-no-files-found: error

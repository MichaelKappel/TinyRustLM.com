name: TinyRustLM NuGet CI

on:
  push:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify-archive-scan-helper:
    name: Verify archive scanner (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Replay frozen hostile archive corpus
        run: cargo run --locked --manifest-path rust/crates/tinyrustlm-archive/fuzz/Cargo.toml --bin replay_archive_corpus

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify archive package producer and local consumer
        run: node --test tinyrustlm/tests/archive-fuzz-contract.test.js tinyrustlm/tests/archive-fuzz-hosted-verification.test.js tinyrustlm/tests/archive-scan-helper-package.test.js tinyrustlm/tests/archive-scan-helper-verification.test.js tinyrustlm/tests/archive-scan-client.test.js tinyrustlm/tests/public-evidence-secret-scan.test.js

      - name: Build release archive scanner package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: eng/build-archive-scan-helper.ps1 -Configuration release

      - name: Build release archive scanner package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash eng/build-archive-scan-helper.sh release

      - name: Verify clean release-package consumer
        env:
          TINYRUSTLM_ARCHIVE_SCAN_TEST_PACKAGE_ROOT: ${{ github.workspace }}/artifacts/archive-scan-helper/${{ matrix.rid }}
        run: node --test tinyrustlm/tests/archive-scan-client.test.js tinyrustlm/tests/archive-scan-helper-verification.test.js tinyrustlm/tests/public-evidence-secret-scan.test.js

      - name: Record native fixed-vector replay
        run: >-
          node tinyrustlm/tools/archive-scan-helper-verification.js
          "${{ github.workspace }}/artifacts/archive-scan-helper/${{ matrix.rid }}"
          "${{ runner.temp }}/archive-scan-helper-verification/${{ matrix.rid }}"
          "${{ runner.temp }}"

      - name: Upload verified archive scanner package
        uses: actions/upload-artifact@v4
        with:
          name: tinyrustlm-archive-scan-helper-${{ matrix.rid }}
          path: artifacts/archive-scan-helper/${{ matrix.rid }}/*
          if-no-files-found: error

      - name: Upload native replay record
        uses: actions/upload-artifact@v4
        with:
          name: tinyrustlm-archive-scan-helper-verification-${{ matrix.rid }}
          path: ${{ runner.temp }}/archive-scan-helper-verification/${{ matrix.rid }}/*
          if-no-files-found: error

  verify-directory-flush-helper:
    name: Verify directory flush helper (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify package, client, and replay contracts
        run: >-
          node --preserve-symlinks --preserve-symlinks-main --test --test-concurrency=1
          tinyrustlm/tests/directory-flush-helper-package.test.js
          tinyrustlm/tests/directory-flush-helper-verification.test.js
          tinyrustlm/tests/vnext-directory-flush-client.test.js

      - name: Build release directory flush package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: eng/build-directory-flush-helper.ps1 -Configuration release

      - name: Build release directory flush package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash eng/build-directory-flush-helper.sh release

      - name: Record native fixed-directory replay
        run: >-
          node --preserve-symlinks --preserve-symlinks-main
          tinyrustlm/tools/directory-flush-helper-verification.js run
          "${{ github.workspace }}/artifacts/directory-flush-helper/${{ matrix.rid }}"
          "${{ runner.temp }}/directory-flush-helper-verification/${{ matrix.rid }}"
          "${{ runner.temp }}"

      - name: Verify retained package and replay record
        run: >-
          node --preserve-symlinks --preserve-symlinks-main
          tinyrustlm/tools/directory-flush-helper-verification.js verify
          "${{ github.workspace }}/artifacts/directory-flush-helper/${{ matrix.rid }}"
          "${{ runner.temp }}/directory-flush-helper-verification/${{ matrix.rid }}"

      - name: Upload verified directory flush package
        uses: actions/upload-artifact@v4
        with:
          name: tinyrustlm-directory-flush-helper-${{ matrix.rid }}
          path: artifacts/directory-flush-helper/${{ matrix.rid }}/*
          if-no-files-found: error
          retention-days: 90

      - name: Upload native replay record
        uses: actions/upload-artifact@v4
        with:
          name: tinyrustlm-directory-flush-helper-verification-${{ matrix.rid }}
          path: ${{ runner.temp }}/directory-flush-helper-verification/${{ matrix.rid }}/*
          if-no-files-found: error
          retention-days: 90

  verify-archive-fuzz:
    name: Verify structured archive fuzz target
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pinned Rust nightly
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-08-01
          components: rust-src

      - name: Install pinned cargo-fuzz
        shell: bash
        run: |
          cargo +nightly-2026-08-01 install cargo-fuzz --version 0.13.2 --locked
          test "$(cargo +nightly-2026-08-01 fuzz --version)" = "cargo-fuzz 0.13.2"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify hosted fuzz evidence contract
        run: node --test tinyrustlm/tests/archive-fuzz-contract.test.js tinyrustlm/tests/archive-fuzz-hosted-verification.test.js

      - name: Fetch exact locked fuzz dependencies
        shell: bash
        run: cargo +nightly-2026-08-01 fetch --locked --manifest-path rust/crates/tinyrustlm-archive/fuzz/Cargo.toml

      - name: Run and record pinned hosted sanitizer verification
        shell: bash
        run: >-
          node tinyrustlm/tools/archive-fuzz-hosted-verification.js run
          "${RUNNER_TEMP}/archive-fuzz-hosted-verification"
          "${RUNNER_TEMP}"

      - name: Upload hosted sanitizer verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tinyrustlm-archive-fuzz-hosted-verification-${{ runner.arch }}
          path: ${{ runner.temp }}/archive-fuzz-hosted-verification/*
          if-no-files-found: error
          retention-days: 90

  verify-nuget-sdk:
    name: Verify protected NuGet SDK
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tinyrustlm/package-lock.json

      - name: Install browser test dependencies
        shell: pwsh
        run: npm ci --prefix tinyrustlm

      - name: Verify Python tooling and obsolete producer retirement
        shell: pwsh
        run: |
          $review = Get-Content artifacts/ecosystem-cleanup-20260912/retired-training-producers-review.json -Raw | ConvertFrom-Json
          if ($review.schema -cne 'tinyrustlm.retired-training-producers-review.v1' -or $review.files.Count -ne 26) { throw 'Unexpected training retirement inventory.' }
          $remaining = @($review.files | Where-Object { Test-Path -LiteralPath $_.path })
          if ($remaining.Count -ne 0) { throw "$($remaining.Count) reviewed obsolete training source/control files remain; retire them before executing current Python tooling checks." }
          python -m unittest discover -s tinyrustlm/tools/tests -p "test_*.py" -v

      - name: Verify offline and distributed MemoryEndpoints sync contracts
        shell: pwsh
        run: |
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'tinyrustlm-release-surface-gate'
          New-Item -ItemType Directory -Path $evidenceRoot | Out-Null
          npm --prefix tinyrustlm run test:unit -- $evidenceRoot

      - name: Verify deployed distributed-sync wire contract against fixture
        shell: pwsh
        run: eng/verify-memory-endpoints-distributed-sync-fixture.ps1

      - name: Verify single-use enrollment replay and cleanup control flow
        shell: pwsh
        run: eng/verify-memory-endpoints-single-use-enrollment-fixture.ps1

      - name: Verify TinyRustLM UI contract
        shell: pwsh
        run: eng/verify-tinyrustlm-ui.ps1 -RunBrowserSmoke

      - name: Verify TinyRustLM public root contract
        shell: pwsh
        run: eng/verify-tinyrustlm-public-root.ps1

      - name: Verify TinyRustLM UI report schema
        shell: pwsh
        env:
          TINYRUSTLM_UI_VERIFICATION_REPORT: artifacts/reports/tinyrustlm-ui-verification.json
          TINYRUSTLM_PUBLIC_ROOT_VERIFICATION_REPORT: artifacts/reports/tinyrustlm-public-root-verification.json
        run: dotnet test dotnet/tests/TinyRustLM.Package.Tests/TinyRustLM.Package.Tests.csproj -c Release --filter "UiVerificationReportIsMachineReadableWhenPresent|PublicRootVerificationReportIsMachineReadableWhenPresent"

      - name: Verify package boundary
        shell: pwsh
        run: eng/verify-package.ps1

      - name: Verify exact public package graph
        shell: pwsh
        run: |
          $expected = @('TinyRustLM.Abstractions', 'TinyRustLM.Core', 'TinyRustLM.P2P')
          $audit = Get-Content -LiteralPath artifacts/packages/tinyrustlm-nuget-package-audit.json -Raw | ConvertFrom-Json
          $actual = @($audit.packages | ForEach-Object { $_.package_id } | Sort-Object)
          if (($actual -join "`n") -cne (($expected | Sort-Object) -join "`n")) {
              throw 'Packed public package graph does not match the exact three-package authority.'
          }

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: tinyrustlm-nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error

      - name: Upload NuGet audit reports
        uses: actions/upload-artifact@v4
        with:
          name: tinyrustlm-nuget-reports
          path: artifacts/reports/*.json

      - name: Upload TinyRustLM UI verification reports
        uses: actions/upload-artifact@v4
        with:
          name: tinyrustlm-ui-verification
          path: |
            artifacts/reports/tinyrustlm-ui-verification.json
            artifacts/reports/tinyrustlm-public-root-verification.json
            artifacts/reports/ui-verification/**
            artifacts/reports/public-root-verification/**
          if-no-files-found: error

  verify-companion-release-boundary:
    name: Verify closed companion release boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tinyrustlm/package-lock.json

      - name: Install browser test dependencies
        run: npm ci --prefix tinyrustlm

      - name: Verify unavailable release and no instruction-file handoff
        run: node --test tinyrustlm/tests/model-acquisition.test.js

[package]
name = "tinyrustlm-prompt2"
version = "0.1.0"
edition = "2021"
license = "Proprietary"
authors = ["TinyRustLM maintainers"]
repository = "https://TinyRustLM.com/"
description = "Canonical Prompt2 artifact, wire contracts, and exact prompt composition runtime."

[dependencies]
sha2 = "=0.10.9"
tinyrustlm-sampling2 = { path = "../tinyrustlm-sampling2" }
tinyrustlm-template2 = { path = "../tinyrustlm-template2" }
tinyrustlm-tokenizer2 = { path = "../tinyrustlm-tokenizer2" }

[dev-dependencies]
serde_json = "=1.0.150"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace]
members = ["."]
resolver = "2"

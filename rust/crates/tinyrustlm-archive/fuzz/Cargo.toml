[workspace]
members = ["."]

[package]
name = "tinyrustlm-archive-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license = "Proprietary"

[package.metadata]
cargo-fuzz = true

[features]
fuzzing = ["dep:libfuzzer-sys"]

[dependencies]
arbitrary = "=1.4.2"
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
libfuzzer-sys = { version = "=0.4.13", optional = true }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
tinyrustlm-archive = { path = ".." }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[[bin]]
name = "structured_archive"
path = "fuzz_targets/structured_archive.rs"
test = false
doc = false
bench = false
required-features = ["fuzzing"]

[[bin]]
name = "replay_archive_corpus"
path = "src/bin/replay_archive_corpus.rs"
doc = false
bench = false
